---
name: Build container image

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "15 10 */2 * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  IMAGE_NAME: ammix-os
  IMAGE_REGISTRY: ghcr.io/ammix
  DEFAULT_TAG: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Build image
        run: sudo -E podman build --pull=newer --tag localhost/${IMAGE_NAME}:${DEFAULT_TAG} .

      - name: Rechunk image
        run: |
          sudo -E podman run --rm \
            --pull=never \
            --privileged \
            -v /var/lib/containers:/var/lib/containers \
            --entrypoint /usr/bin/rpm-ostree \
            localhost/${IMAGE_NAME}:${DEFAULT_TAG} \
            compose build-chunked-oci \
            --max-layers 127 \
            --format-version=2 \
            --bootc \
            --from localhost/${IMAGE_NAME}:${DEFAULT_TAG} \
            --output containers-storage:localhost/${IMAGE_NAME}:${DEFAULT_TAG}

      - name: Generate tags
        id: tags
        shell: bash
        run: |
          date_tag="$(date -u +%Y%m%d)"
          short_sha="${GITHUB_SHA::7}"
          tags="${DEFAULT_TAG} ${DEFAULT_TAG}-${date_tag} ${date_tag} ${DEFAULT_TAG}-${short_sha} ${DEFAULT_TAG}-${date_tag}-${short_sha} ${date_tag}-${short_sha}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - name: Tag image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            if [[ "${tag}" == "${DEFAULT_TAG}" ]]; then
              continue
            fi
            sudo -E podman tag \
              localhost/${IMAGE_NAME}:${DEFAULT_TAG} \
              localhost/${IMAGE_NAME}:${tag}
          done

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            sudo -E podman push \
              --digestfile=/tmp/digestfile \
              localhost/${IMAGE_NAME}:${tag} \
              ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done
          echo "digest=$(</tmp/digestfile)" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign image digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: >-
          cosign sign -y
          --new-bundle-format=false
          --use-signing-config=false
          --key env://COSIGN_PRIVATE_KEY
          ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
